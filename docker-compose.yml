services:
  db:
    image: postgres:15-alpine
    container_name: atm-constructor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: atm_user
      POSTGRES_PASSWORD: atm_password
      POSTGRES_DB: atm_constructor
    volumes:
      - atm_constructor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm_user -d atm_constructor"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: atm-constructor-backend:demo
    container_name: atm-constructor-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://atm_user:atm_password@db:5432/atm_constructor?schema=public
      JWT_SECRET: atm_constructor_super_secret_key
      JWT_EXPIRES_IN: 7d
      ADMIN_JWT_SECRET: atm_constructor_admin_super_secret_key
      ADMIN_JWT_EXPIRES_IN: 7d
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: atm-constructor-frontend:demo
    container_name: atm-constructor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  atm_constructor_db_data:
